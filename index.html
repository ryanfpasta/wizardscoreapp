<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14112B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wizard Score">
<title>Wizard Score</title>
<link rel="icon" href="app-icon.png">
<link rel="apple-touch-icon" href="app-icon.png">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg:#14112B; --card:#231E48; --card2:#302A62; --stripe:#2A2455; --bar:#1B1739;
    --gold:#F2C14E; --text:#F4F1FF; --muted:#A9A3CC; --hint:#6E6896; --green:#5FD38D; --red:#FF6B6B;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--text);
    font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  body { min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
  #app { flex:1; display:flex; flex-direction:column; width:100%; max-width:640px; margin:0 auto; }
  .content { flex:1; padding:16px 16px 24px; }
  .bar { position:sticky; bottom:0; display:flex; gap:10px; padding:10px 16px calc(14px + env(safe-area-inset-bottom));
    background:var(--bar); }
  .bar .btn { flex:1; } .bar .btn.wide { flex:1.4; }
  h1 { font-size:26px; margin:0; } h2 { font-size:18px; margin:0; }
  .muted { color:var(--muted); } .small { font-size:13px; } .tiny { font-size:12px; }
  .gold { color:var(--gold); } .green { color:var(--green); } .red { color:var(--red); }
  .card { background:var(--card); border-radius:16px; padding:14px 16px 16px; margin-top:12px; }
  .row { display:flex; align-items:center; gap:10px; }
  .grow { flex:1; min-width:0; }
  .btn { display:block; width:100%; border:0; border-radius:12px; padding:13px 14px; font:inherit; font-weight:700;
    background:var(--card2); color:var(--text); cursor:pointer; text-align:center; }
  .btn.primary { background:var(--gold); color:var(--bg); }
  .btn:disabled { opacity:.4; cursor:default; }
  .btn.auto { width:auto; }
  .head { display:flex; align-items:center; gap:14px; }
  .head img { width:64px; height:64px; }
  .chips { display:flex; gap:8px; margin-top:6px; }
  .chip-n { flex:1; border:0; border-radius:10px; padding:10px 0; font:inherit; font-size:18px; font-weight:700;
    background:var(--card2); color:var(--text); cursor:pointer; }
  .chip-n.on { background:var(--gold); color:var(--bg); }
  input[type=text] { width:100%; margin-top:8px; border:0; border-radius:10px; padding:11px 12px; font:inherit;
    background:var(--card2); color:var(--text); outline:none; }
  input[type=text]::placeholder { color:var(--hint); }
  input[type=text]:focus { box-shadow:0 0 0 2px var(--gold) inset; }
  .switch { position:relative; width:50px; height:30px; flex:none; }
  .switch input { opacity:0; width:0; height:0; }
  .switch span { position:absolute; inset:0; background:var(--card2); border-radius:15px; transition:.15s; cursor:pointer; }
  .switch span::before { content:""; position:absolute; left:3px; top:3px; width:24px; height:24px; border-radius:50%;
    background:var(--muted); transition:.15s; }
  .switch input:checked + span { background:var(--gold); }
  .switch input:checked + span::before { transform:translateX(20px); background:var(--bg); }
  ul.rules { margin:6px 0 0; padding-left:18px; color:var(--muted); font-size:14px; }
  ul.rules li { margin-top:6px; }
  .pill { display:inline-block; background:var(--card2); border-radius:20px; padding:6px 12px; font-size:13px; margin-top:10px; }
  .link { background:none; border:0; color:var(--gold); font:inherit; font-weight:700; font-size:14px; padding:8px 4px 8px 12px; cursor:pointer; }
  .player { padding-top:14px; }
  .player + .player { border-top:1px solid var(--card2); margin-top:12px; }
  .cols { display:flex; align-items:flex-start; margin-top:6px; }
  .col { flex:1; display:flex; flex-direction:column; align-items:center; }
  .col.pts { flex:none; width:52px; }
  .lbl { font-size:11px; font-weight:700; color:var(--gold); letter-spacing:.04em; }
  .stepper { display:flex; align-items:center; margin-top:2px; }
  .circ { width:40px; height:40px; border-radius:50%; border:0; background:var(--card2); color:var(--text);
    font-size:22px; font-weight:700; cursor:pointer; line-height:1; }
  .circ:disabled { opacity:.35; cursor:default; }
  .val { width:38px; text-align:center; font-size:24px; font-weight:700; color:var(--gold); }
  .ptsv { font-size:18px; font-weight:700; padding-top:10px; }
  .status { font-weight:700; margin-top:16px; }
  .stand { display:flex; padding-top:6px; }
  .tablewrap { overflow-x:auto; margin-top:12px; background:var(--card); border-radius:14px; padding:8px 6px; }
  table { border-collapse:separate; border-spacing:0; }
  th, td { text-align:center; padding:5px 0; white-space:nowrap; }
  td.rd, th.rd { width:40px; }
  .pname { background:var(--card2); border-radius:8px; padding:4px; color:var(--gold); font-weight:700; font-size:14px;
    max-width:124px; overflow:hidden; text-overflow:ellipsis; margin-left:6px; }
  .sub th { font-size:11px; color:var(--muted); font-weight:700; }
  .cb { width:34px; } .ct { width:40px; } .cs { width:56px; } .gap { width:6px; padding:0; }
  tr.stripe td { background:var(--stripe); }
  tr.stripe td:first-child { border-radius:8px 0 0 8px; } tr.stripe td:last-child { border-radius:0 8px 8px 0; }
  .sc { font-weight:700; font-size:15px; } .sd { font-size:11px; }
  tr.total td { border-top:1px solid var(--gold); padding-top:8px; color:var(--gold); font-weight:700; }
  .trophy { font-size:64px; text-align:center; margin-top:12px; }
  .center { text-align:center; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; padding:16px; z-index:10; }
  .dialog { background:var(--card); border-radius:18px; padding:20px; width:100%; max-width:400px; max-height:90vh; overflow:auto; }
  .dialog h2 { margin-bottom:8px; }
  .dialog .acts { display:flex; gap:10px; margin-top:18px; }
  .dialog .acts .btn { flex:1; }
  .menu .btn { margin-top:8px; }
  .resline { display:flex; justify-content:space-between; gap:8px; padding:4px 0; font-size:15px; }
  .foot { text-align:center; font-size:13px; margin:18px 0 4px; }
  .foot a { color:var(--muted); }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<script>
(function () {
  "use strict";
  var DECK = 60;
  var STORE = "wizard-score-v1";

  // ---------------------------------------------------------------- game model
  function newGame(names, hook, firstDealer) {
    return { names: names, hook: hook, firstDealer: firstDealer, rounds: [],
             curBids: names.map(function () { return 0; }),
             curTricks: names.map(function () { return 0; }) };
  }
  function n(g) { return g.names.length; }
  function totalRounds(g) { return Math.floor(DECK / n(g)); }
  function round(g) { return g.rounds.length; }
  function cards(g) { return round(g) + 1; }
  function isOver(g) { return round(g) >= totalRounds(g); }
  function dealer(g) { return (g.firstDealer + round(g)) % n(g); }
  function bidder(g, i) { return (dealer(g) + 1 + i) % n(g); }
  function score(bid, took) { return bid === took ? 20 + 10 * took : -10 * Math.abs(bid - took); }
  function roundScore(g, r, p) { return score(g.rounds[r].b[p], g.rounds[r].t[p]); }
  function totalThrough(g, p, last) {
    var t = 0;
    for (var r = 0; r <= last && r < g.rounds.length; r++) t += roundScore(g, r, p);
    return t;
  }
  function total(g, p) { return totalThrough(g, p, round(g) - 1); }
  function sum(a) { return a.reduce(function (x, y) { return x + y; }, 0); }
  function forbiddenDealerBid(g) {
    if (!g.hook) return -1;
    var others = sum(g.curBids) - g.curBids[dealer(g)];
    var f = cards(g) - others;
    return f >= 0 && f <= cards(g) ? f : -1;
  }
  function bidsValid(g) { return !(g.hook && sum(g.curBids) === cards(g)); }
  function tricksValid(g) { return sum(g.curTricks) === cards(g); }
  function finishRound(g) {
    g.rounds.push({ b: g.curBids.slice(), t: g.curTricks.slice() });
    g.curBids = g.names.map(function () { return 0; });
    g.curTricks = g.names.map(function () { return 0; });
  }
  function undoRound(g) {
    if (!g.rounds.length) return;
    var last = g.rounds.pop();
    g.curBids = last.b; g.curTricks = last.t;
  }
  function ranking(g) {
    var o = g.names.map(function (_, i) { return i; });
    o.sort(function (a, b) { return total(g, b) - total(g, a) || a - b; });
    return o;
  }

  // ---------------------------------------------------------------- state + storage
  var state = { game: null, setupCount: 4, setupNames: ["", "", "", "", "", ""], setupHook: false,
                setupDealer: 0, endedEarly: false };
  function save() {
    try {
      localStorage.setItem(STORE, JSON.stringify({ game: state.game, count: state.setupCount,
        names: state.setupNames, hook: state.setupHook }));
    } catch (e) {}
  }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(STORE) || "null");
      if (!s) return;
      if (s.game && s.game.names && s.game.rounds) state.game = s.game;
      if (s.count >= 2 && s.count <= 6) state.setupCount = s.count;
      if (Array.isArray(s.names)) for (var i = 0; i < 6; i++) state.setupNames[i] = s.names[i] || "";
      state.setupHook = !!s.hook;
    } catch (e) {}
  }

  // ---------------------------------------------------------------- helpers
  var app = document.getElementById("app");
  var modalRoot = document.getElementById("modal-root");
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function signed(v) { return v > 0 ? "+" + v : v < 0 ? "−" + (-v) : "0"; }
  function plural(k, w) { return k + " " + w + (k === 1 ? "" : "s"); }
  function setupName(i) {
    var s = (state.setupNames[i] || "").trim();
    return s || "Player " + (i + 1);
  }
  function el(html) { var d = document.createElement("div"); d.innerHTML = html; return d; }
  function on(root, sel, ev, fn) {
    Array.prototype.forEach.call(root.querySelectorAll(sel), function (e) { e.addEventListener(ev, fn); });
  }
  function closeModal() { modalRoot.innerHTML = ""; }
  // buttons: [{label, primary, fn}]
  function dialog(title, bodyHtml, buttons, dismissable) {
    var d = el('<div class="modal"><div class="dialog" role="dialog" aria-modal="true">' +
      (title ? "<h2>" + esc(title) + "</h2>" : "") + bodyHtml +
      '<div class="acts"></div></div></div>');
    var acts = d.querySelector(".acts");
    buttons.forEach(function (b) {
      var btn = document.createElement("button");
      btn.className = "btn" + (b.primary ? " primary" : "");
      btn.textContent = b.label;
      btn.addEventListener("click", function () { closeModal(); if (b.fn) b.fn(); });
      acts.appendChild(btn);
    });
    if (dismissable !== false) {
      d.firstChild.addEventListener("click", function (e) { if (e.target === d.firstChild) closeModal(); });
    }
    modalRoot.innerHTML = "";
    modalRoot.appendChild(d.firstChild);
  }
  function confirmDlg(title, msg, okLabel, fn) {
    dialog(title, '<p class="muted">' + esc(msg) + "</p>",
      [{ label: "Cancel" }, { label: okLabel, primary: true, fn: fn }]);
  }
  function render(html, barHtml) {
    app.innerHTML = '<div class="content">' + html + "</div>" + (barHtml ? '<div class="bar">' + barHtml + "</div>" : "");
    window.scrollTo(0, 0);
  }

  // ---------------------------------------------------------------- home / setup
  function showHome() {
    var g = state.game, h = "";
    h += '<div class="head"><img src="logo.png" alt=""><div><h1>Wizard Score</h1>' +
         '<div class="muted small">Bid your tricks. We\'ll keep the score.</div></div></div>';
    if (g) {
      if (isOver(g)) {
        h += '<div class="card"><h2>Last game finished</h2><div class="muted small">' + esc(g.names.join(", ")) +
             '</div><button class="btn primary" id="results" style="margin-top:12px">See results</button></div>';
      } else {
        h += '<div class="card"><h2>Game in progress</h2><div class="muted small">Round ' + cards(g) + " of " +
             totalRounds(g) + " · " + esc(g.names.join(", ")) +
             '</div><button class="btn primary" id="resume" style="margin-top:12px">Resume game</button></div>';
      }
    }
    var c = state.setupCount, rounds = Math.floor(DECK / c);
    h += '<div class="card"><h2>New game</h2><div class="muted small" style="margin-top:8px">Number of players</div><div class="chips">';
    for (var k = 2; k <= 6; k++) h += '<button class="chip-n' + (k === c ? " on" : "") + '" data-k="' + k + '">' + k + "</button>";
    h += '</div><div class="gold small" style="margin-top:8px">' + c + " players → " + rounds +
         " rounds (1 to " + rounds + ' cards each)</div>';
    h += '<div class="muted small" style="margin-top:12px">Player names (in seating order)</div>';
    for (var i = 0; i < c; i++) {
      h += '<input type="text" autocapitalize="words" autocomplete="off" enterkeyhint="' + (i === c - 1 ? "done" : "next") +
           '" data-i="' + i + '" placeholder="Player ' + (i + 1) + '" value="' + esc(state.setupNames[i]) + '">';
    }
    h += '<div class="row" style="margin-top:14px"><div class="grow"><div style="font-weight:700">First dealer</div>' +
         '<div class="muted tiny">Deal passes to the left each round</div></div>' +
         '<button class="btn auto" id="dealer">' + esc(setupName(state.setupDealer)) + " ▸</button></div>";
    h += '<div class="row" style="margin-top:14px"><div class="grow"><div style="font-weight:700">Hook rule</div>' +
         '<div class="muted tiny">Dealer can\'t bid so total bids equal the cards dealt</div></div>' +
         '<label class="switch"><input type="checkbox" id="hook"' + (state.setupHook ? " checked" : "") +
         '><span></span></label></div>';
    h += '<button class="btn primary" id="start" style="margin-top:18px">Start game</button></div>';
    h += '<div class="card"><h2>Scoring</h2><ul class="rules">' +
         "<li>Each round, every player bids how many tricks they'll take.</li>" +
         "<li>Bid exactly right: 20 points + 10 per trick taken.</li>" +
         "<li>Missed it: −10 points for each trick over or under.</li>" +
         "<li>Round 1 deals 1 card, round 2 deals 2, and so on. 60 cards ÷ players = number of rounds " +
         "(2 players: 30, 3: 20, 4: 15, 5: 12, 6: 10).</li></ul></div>";
    h += '<div class="foot"><a href="WizardScore.apk" download>Get the Android app (APK)</a> · ' +
         '<a href="https://github.com/ryanfpasta/wizardscoreapp">Source</a></div>';
    render(h);

    var r1 = document.getElementById("results"); if (r1) r1.onclick = showOver;
    var r2 = document.getElementById("resume"); if (r2) r2.onclick = showRound;
    on(app, ".chip-n", "click", function () {
      state.setupCount = +this.getAttribute("data-k");
      if (state.setupDealer >= state.setupCount) state.setupDealer = 0;
      save(); showHome();
    });
    var inputs = app.querySelectorAll("input[type=text]");
    Array.prototype.forEach.call(inputs, function (inp, idx) {
      inp.addEventListener("input", function () {
        state.setupNames[idx] = inp.value;
        if (idx === state.setupDealer) document.getElementById("dealer").textContent = setupName(idx) + " ▸";
        save();
      });
      inp.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); if (inputs[idx + 1]) inputs[idx + 1].focus(); else inp.blur(); }
      });
    });
    document.getElementById("dealer").onclick = function () {
      state.setupDealer = (state.setupDealer + 1) % state.setupCount;
      this.textContent = setupName(state.setupDealer) + " ▸";
    };
    document.getElementById("hook").onchange = function () { state.setupHook = this.checked; save(); };
    document.getElementById("start").onclick = function () {
      if (state.game && !isOver(state.game)) {
        confirmDlg("Start a new game?", "The game in progress will be replaced.", "Start new", startGame);
      } else startGame();
    };
  }
  function startGame() {
    var names = [];
    for (var i = 0; i < state.setupCount; i++) names.push(setupName(i));
    state.game = newGame(names, state.setupHook, state.setupDealer);
    state.endedEarly = false;
    save(); showRound();
  }

  // ---------------------------------------------------------------- round
  function showRound() {
    var g = state.game;
    if (!g) return showHome();
    if (isOver(g)) return showOver();
    var h = '<div class="row"><div class="grow"><h1 style="font-size:24px">Round ' + cards(g) + " of " + totalRounds(g) +
            '</h1><div class="muted small">' + plural(cards(g), "card") + " each · " + plural(cards(g), "trick") +
            ' to win</div></div><button class="link" id="menu">Menu</button></div>';
    h += '<div class="pill">🎩 Dealer: ' + esc(g.names[dealer(g)]) + "</div>";
    h += '<div class="card" style="padding:14px 12px 16px"><h2>Bid and actual tricks</h2><div class="muted small">' +
         "Enter every bid before play (in order, starting left of the dealer). " +
         "After the round, enter the tricks each player actually took.</div>";
    for (var i = 0; i < n(g); i++) {
      var p = bidder(g, i);
      h += '<div class="player"><div class="row"><div class="grow" style="font-weight:700;font-size:17px">' +
           esc(g.names[p]) + (p === dealer(g) ? " 🎩" : "") + '</div><div class="muted small">Total ' +
           total(g, p) + "</div></div>" +
           '<div class="cols">' + stepperHtml("BID", "b", p) + stepperHtml("TOOK", "t", p) +
           '<div class="col pts"><div class="lbl">PTS</div><div class="ptsv" id="pts' + p + '"></div></div></div></div>';
    }
    h += '<div class="status" id="bstat"></div><div class="muted small" id="hookmsg"></div>' +
         '<div class="status" id="tstat" style="margin-top:10px"></div></div>';
    h += '<div class="card"><div style="font-weight:700">Standings</div>';
    ranking(g).forEach(function (p, k) {
      h += '<div class="stand"><div class="grow muted">' + (k + 1) + ". " + esc(g.names[p]) +
           '</div><div style="font-weight:700">' + total(g, p) + "</div></div>";
    });
    h += "</div>";
    render(h, '<button class="btn" id="board">Scoreboard</button><button class="btn primary wide" id="finish">Finish round</button>');

    on(app, ".circ", "click", function () {
      var kind = this.getAttribute("data-k"), p = +this.getAttribute("data-p"), d = +this.getAttribute("data-d");
      var arr = kind === "b" ? g.curBids : g.curTricks;
      var v = arr[p] + d;
      if (v < 0 || v > cards(g)) return;
      arr[p] = v; save(); refreshRound();
    });
    document.getElementById("menu").onclick = roundMenu;
    document.getElementById("board").onclick = showScores;
    document.getElementById("finish").onclick = doFinish;
    refreshRound();
  }
  function stepperHtml(label, kind, p) {
    return '<div class="col"><div class="lbl">' + label + '</div><div class="stepper">' +
      '<button class="circ" aria-label="' + label + ' minus" data-k="' + kind + '" data-p="' + p + '" data-d="-1">−</button>' +
      '<div class="val" id="' + kind + p + '"></div>' +
      '<button class="circ" aria-label="' + label + ' plus" data-k="' + kind + '" data-p="' + p + '" data-d="1">+</button></div></div>';
  }
  function refreshRound() {
    var g = state.game, c = cards(g);
    for (var p = 0; p < n(g); p++) {
      document.getElementById("b" + p).textContent = g.curBids[p];
      document.getElementById("t" + p).textContent = g.curTricks[p];
      var sc = score(g.curBids[p], g.curTricks[p]);
      var pe = document.getElementById("pts" + p);
      pe.textContent = signed(sc);
      pe.className = "ptsv " + (sc >= 0 ? "green" : "red");
    }
    Array.prototype.forEach.call(app.querySelectorAll(".circ"), function (b) {
      var arr = b.getAttribute("data-k") === "b" ? g.curBids : g.curTricks;
      var v = arr[+b.getAttribute("data-p")] + +b.getAttribute("data-d");
      b.disabled = v < 0 || v > c;
    });
    var bsum = sum(g.curBids), diff = bsum - c;
    var rel = diff === 0 ? "even" : diff > 0 ? "over by " + diff : "under by " + (-diff);
    var bs = document.getElementById("bstat");
    var ok = bidsValid(g);
    bs.textContent = "Bids: " + bsum + " of " + c + "  (" + rel + ")";
    bs.className = "status" + (ok ? "" : " red");
    var hm = document.getElementById("hookmsg");
    if (g.hook) {
      var f = forbiddenDealerBid(g), dn = g.names[dealer(g)];
      hm.textContent = !ok ? "Hook rule: " + dn + " can't bid " + f + ". Bids can't add up to " + c + "."
        : f >= 0 ? "Hook rule: " + dn + " (dealer) can't bid " + f + "." : "Hook rule is on.";
      hm.className = "small " + (ok ? "muted" : "red");
      hm.style.display = "";
    } else hm.style.display = "none";
    var tsum = sum(g.curTricks), ts = document.getElementById("tstat");
    var msg = "Tricks taken: " + tsum + " of " + c;
    if (tsum > c) msg += "  (" + (tsum - c) + " too many)";
    else if (tsum < c) msg += "  (" + (c - tsum) + " to assign)";
    ts.textContent = msg;
    ts.className = "status" + (tsum === c ? " green" : tsum > c ? " red" : "");
    document.getElementById("finish").disabled = !(ok && tricksValid(g));
  }
  function roundMenu() {
    var g = state.game;
    var d = el('<div class="modal"><div class="dialog menu"><h2>Menu</h2>' +
      '<button class="btn" data-a="board">Scoreboard</button>' +
      (g.rounds.length ? '<button class="btn" data-a="undo">Undo last round</button>' : "") +
      '<button class="btn" data-a="home">Home</button>' +
      '<button class="btn" data-a="end">End game now</button>' +
      '<button class="btn" data-a="close" style="margin-top:16px;background:none;color:var(--muted)">Close</button></div></div>');
    var m = d.firstChild;
    m.addEventListener("click", function (e) {
      if (e.target === m) return closeModal();
      var a = e.target.getAttribute && e.target.getAttribute("data-a");
      if (!a) return;
      closeModal();
      if (a === "board") showScores();
      else if (a === "home") showHome();
      else if (a === "undo") confirmDlg("Undo round " + round(g) + "?", "Its bids and tricks come back so you can fix them.",
        "Undo", function () { undoRound(g); save(); showRound(); });
      else if (a === "end") confirmDlg("End the game now?",
        "Final scores use the rounds finished so far. The game will be cleared.", "End game",
        function () { state.endedEarly = true; showOver(); });
    });
    modalRoot.innerHTML = ""; modalRoot.appendChild(m);
  }
  function doFinish() {
    var g = state.game, r = round(g);
    if (!(bidsValid(g) && tricksValid(g))) return;
    finishRound(g); save();
    var body = "";
    for (var p = 0; p < n(g); p++) {
      var sc = roundScore(g, r, p);
      body += '<div class="resline"><span>' + esc(g.names[p]) + ' <span class="muted small">(bid ' + g.rounds[r].b[p] +
              ", took " + g.rounds[r].t[p] + ')</span></span><span class="' + (sc >= 0 ? "green" : "red") +
              '" style="font-weight:700">' + signed(sc) + "</span></div>";
    }
    var lead = ranking(g)[0];
    body += '<p class="gold" style="margin:12px 0 0">Leader: ' + esc(g.names[lead]) + " with " + total(g, lead) + "</p>";
    dialog("Round " + (r + 1) + " results", body, [
      { label: "Undo", fn: function () { undoRound(g); save(); showRound(); } },
      { label: isOver(g) ? "Final results" : "Next round", primary: true, fn: showRound }
    ], false);
  }

  // ---------------------------------------------------------------- scoreboard
  function showScores() {
    var g = state.game;
    if (!g) return showHome();
    var h = '<h1 style="font-size:24px">Scoreboard</h1><div class="muted small">Bid and Took for each round, then the ' +
            "running score (round points underneath). Swipe sideways for more players.</div>";
    h += '<div class="tablewrap"><table><thead><tr><th class="rd"></th>';
    g.names.forEach(function (nm) { h += '<th colspan="4"><div class="pname">' + esc(nm) + "</div></th>"; });
    h += '</tr><tr class="sub"><th class="rd">Rd</th>';
    g.names.forEach(function () { h += '<th class="gap"></th><th class="cb">Bid</th><th class="ct">Took</th><th class="cs">Score</th>'; });
    h += "</tr></thead><tbody>";
    g.rounds.forEach(function (rd, r) {
      h += "<tr" + (r % 2 === 0 ? ' class="stripe"' : "") + '><td class="rd" style="font-weight:700">' + (r + 1) + "</td>";
      for (var p = 0; p < n(g); p++) {
        var b = rd.b[p], t = rd.t[p], sc = roundScore(g, r, p);
        h += '<td class="gap"></td><td>' + b + '</td><td class="' + (b === t ? "green" : "red") + '" style="font-weight:700">' + t +
             '</td><td><div class="sc">' + totalThrough(g, p, r) + '</div><div class="sd ' + (sc >= 0 ? "green" : "red") + '">' +
             signed(sc) + "</div></td>";
      }
      h += "</tr>";
    });
    if (!isOver(g) && !state.endedEarly) {
      h += '<tr><td class="rd muted" style="font-weight:700">' + cards(g) + "</td>";
      for (var p = 0; p < n(g); p++) h += '<td class="gap"></td><td class="muted">' + g.curBids[p] + '</td><td class="muted">…</td><td></td>';
      h += "</tr>";
    }
    h += '<tr class="total"><td class="rd" style="font-size:12px">Total</td>';
    for (var q = 0; q < n(g); q++) h += '<td colspan="3"></td><td style="font-size:18px">' + total(g, q) + "</td>";
    h += "</tr></tbody></table></div>";
    var remaining = totalRounds(g) - round(g);
    h += '<div class="muted small" style="margin-top:12px">' +
         (remaining > 0 && !state.endedEarly ? plural(remaining, "round") + " left, including the current one." : "Game complete.") + "</div>";
    render(h, '<button class="btn primary" id="back">Back</button>');
    document.getElementById("back").onclick = function () {
      if (isOver(g) || state.endedEarly) showOver(); else showRound();
    };
  }

  // ---------------------------------------------------------------- game over
  function leaveOver() {
    if (state.endedEarly) { state.game = null; state.endedEarly = false; save(); }
    showHome();
  }
  function showOver() {
    var g = state.game;
    if (!g) return showHome();
    var order = ranking(g), best = total(g, order[0]);
    var winners = order.filter(function (p) { return total(g, p) === best; }).map(function (p) { return g.names[p]; });
    var h = '<div class="trophy">🏆</div><h1 class="gold center" style="font-size:28px">' +
            esc(winners.length === 1 ? winners[0] + " wins!" : "Tie: " + winners.join(" & ") + "!") + "</h1>" +
            '<div class="muted small center">' + (isOver(g) ? "After all " : "After ") + plural(round(g), "round") +
            " with " + best + " points</div>";
    h += '<div class="card"><div style="font-weight:700">Final standings</div>';
    var place = 0, prev = null;
    order.forEach(function (p, k) {
      var t = total(g, p);
      if (t !== prev) { place = k + 1; prev = t; }
      var hits = g.rounds.filter(function (rd) { return rd.b[p] === rd.t[p]; }).length;
      h += '<div class="row" style="padding-top:10px"><div class="grow"><div style="font-weight:700;font-size:17px" class="' +
           (place === 1 ? "gold" : "") + '">' + place + ". " + esc(g.names[p]) + '</div><div class="muted tiny">Made ' + hits +
           " of " + g.rounds.length + ' bids</div></div><div style="font-weight:700;font-size:20px">' + t + "</div></div>";
    });
    h += '</div><button class="btn" id="full" style="margin-top:14px">Full scoreboard</button>';
    render(h, '<button class="btn" id="home">Home</button><button class="btn primary wide" id="again">Play again</button>');
    document.getElementById("full").onclick = showScores;
    document.getElementById("home").onclick = leaveOver;
    document.getElementById("again").onclick = function () {
      state.game = newGame(g.names.slice(), g.hook, (g.firstDealer + 1) % n(g));
      state.endedEarly = false; save(); showRound();
    };
  }

  // ---------------------------------------------------------------- start
  load();
  if (state.game && !isOver(state.game)) showRound(); else showHome();
})();
</script>
</body>
</html>
